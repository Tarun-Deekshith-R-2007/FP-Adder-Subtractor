name: RTL verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  simulate-and-synthesize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys
      - name: Exact arithmetic and protocol tests
        run: make test
      - name: Synthesis and latch checks
        run: make synth
